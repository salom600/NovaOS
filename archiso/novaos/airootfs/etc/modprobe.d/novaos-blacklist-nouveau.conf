# NovaOS - blacklist nouveau
#
# Why: nouveau (the open-source Nvidia driver) has poor support for
# Pascal (GTX 10-series, 2016) and newer GPUs. When both nouveau and
# nvidia load, whichever wins the race takes the GPU. On Pascal+, this
# often results in a blank screen at SDDM startup.
#
# Solution: blacklist nouveau globally. The proprietary nvidia-dkms driver
# is the only viable option for 2016+ Nvidia hardware.
#
# Users who specifically want nouveau (e.g., for reverse-engineering work)
# can override this with: modprobe.blacklist="" on the kernel cmdline,
# or simply remove this file.
blacklist nouveau
