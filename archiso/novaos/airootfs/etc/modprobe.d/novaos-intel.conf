# NovaOS - Intel iGPU module options
#
# IMPORTANT: enable_guc=3 is REMOVED from here. It requires GuC firmware
# which only exists for Gen 12+ (Tiger Lake, 2020+). On older Intel GPUs
# (Skylake Gen9, Kaby Lake, Coffee Lake - all 2016-2019), enable_guc=3
# causes DRM init to fail and produces a BLANK SCREEN at SDDM startup.
#
# The novaos-hardware-optimizer service now sets enable_guc=3 conditionally
# at runtime, only after probing the CPU generation. See:
#   /usr/local/bin/novaos-hardware-optimizer.py
#
# Safe options for all Intel generations:
options i915 enable_fbc=1 fastboot=1
options i915 enable_dc=2 disable_power_well=0
# enable_psr (Panel Self Refresh) is safe on Gen 8+ but can cause flicker
# on some panels; leave it to the kernel default.
