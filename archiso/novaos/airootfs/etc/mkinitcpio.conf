#
# /etc/mkinitcpio.conf - NovaOS
#
# CRITICAL: The 'archiso' hook MUST be in HOOKS for the live ISO to boot.
# Without it, the initramfs has no code to parse 'archisolabel=' from the
# kernel command line, and boot fails with:
#   ERROR: device '' not found. Skipping fsck.
#   mount: /new_root: fsconfig() failed: Can't lookup blockdev.
#
# The 'autodetect' hook is OMITTED intentionally - a live ISO must boot on
# many different machines, so we include ALL modules (not just the build
# host's hardware). This makes the initramfs larger but ensures broad
# hardware compatibility.
#
# HOOKS order matches the official archiso releng profile:
#   base -> udev -> modconf -> kms -> archiso -> block -> filesystems -> keyboard -> fsck
#

# Modules - only essentials that must load before rootfs mount
# (storage + virtualisation hosts; GPU handled by kms hook)
MODULES=(virtio virtio_blk virtio_pci virtio_net virtio_console
         ext4 btrfs xfs f2fs vfat
         nvme ahci sdhci usb-storage uas)

# Binaries
BINARIES=(setfont)

# Files
FILES=()

# Hooks - order matters!
# 'archiso' is the hook that finds and mounts the live medium
# 'kms' loads GPU drivers early for Wayland
# 'block' makes block devices available
# 'filesystems' mounts the root filesystem
HOOKS=(base udev modconf kms archiso block filesystems keyboard fsck)

# Compression
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-c -T0 -1)

# Build initramfs for both linux and linux-lts
ALL_kver="/boot/vmlinuz-linux"
ALL_config="/etc/mkinitcpio.conf"
