#
# /etc/mkinitcpio.conf - NovaOS
#
# NovaOS uses a fairly standard Arch mkinitcpio config, with a couple of
# additions for broad hardware support:
#   - 'plymouth' hook for the animated boot splash (if plymouth enabled)
#   - 'resume' for hibernate-to-swap support
#   - early-load of common GPU drivers in MODULES
#

# Modules - early-load these so display works immediately at boot
MODULES=(amdgpu radeon i915 nouveau nvidia nvidia_modeset nvidia_drm nvidia_uvm
         virtio virtio_blk virtio_pci virtio_net virtio_console
         ext4 btrfs xfs f2fs vfat nfsv4
         nvme ahci sdhci usb-storage uas
         intel_agp mgagmg ast)

# Binaries
BINARIES=(setfont)

# Files
FILES=()

# Hooks - order matters!
# 'systemd' replaces 'base', 'udev', 'autodetect', 'modconf', 'block',
# 'filesystems', 'keyboard', 'sd-vconsole', 'resume'
HOOKS=(base udev autodetect modconf kms block filesystems keyboard fsck)

# Compression
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-c -T0 -1)

# Limit to one kernel for faster builds
ALL_kver="/boot/vmlinuz-linux"
ALL_config="/etc/mkinitcpio.conf"
