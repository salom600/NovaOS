#
# /etc/mkinitcpio.conf - NovaOS
#
# IMPORTANT: Do NOT put GPU drivers in MODULES=().
#
# Why: Listing amdgpu + radeon + i915 + nouveau + nvidia all together causes
# a load race on hybrid/dual-GPU machines. On a 2016 Nvidia laptop, both
# nouveau AND nvidia would early-load, and whichever wins the race takes
# the GPU. Pascal (GTX 10-series) has broken nouveau support -> blank screen.
#
# The 'kms' hook below handles early KMS loading correctly by reading
# modaliases. Only nvidia_drm needs special handling, done via the
# nvidia_drm.modeset=1 kernel command line parameter in the bootloader.
#

# Modules - only essentials that must load before rootfs mount
# (storage + virtualisation hosts; GPU handled by kms hook)
MODULES=(virtio virtio_blk virtio_pci virtio_net virtio_console
         ext4 btrfs xfs f2fs vfat
         nvme ahci sdhci usb-storage uas)

# Binaries
BINARIES=(setfont)

# Files
FILES=()

# Hooks - order matters!
# 'kms' hook auto-detects GPU drivers from modaliases and loads them early
# for KMS (Kernel Mode Setting) - required for Wayland.
HOOKS=(base udev autodetect modconf kms block filesystems keyboard fsck)

# Compression
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-c -T0 -1)

# Build initramfs for both linux and linux-lts
ALL_kver="/boot/vmlinuz-linux"
ALL_config="/etc/mkinitcpio.conf"
