# NovaOS SDDM theme configuration
[General]
type=color
color=#1A1F2E
background=assets/wallpaper.mp4
background_type=video
background_fill=cover

# Layer 1: greeter screen (logo + clock)
show_logo=true
logo=assets/novaos-logo.svg
logo_size=120
greeting_text=Welcome to NovaOS
greeting_subtext=Hello. Just a moment...
show_clock=true
clock_24h=true
clock_font_size=72
clock_color=#E8EEF7
date_font_size=18
date_color=#A0AEC8

# Layer 2: password entry
user_avatar_shape=circle
user_avatar_size=88
password_placeholder=Enter password
show_password_visibility=true
show_session_selector=true
show_shutdown_buttons=true
blur_strength=22
glass_color=#0E1422
glass_alpha=140
accent=#78A0FF
accent_text=#FFFFFF

# Animations
fade_in_ms=450
fade_out_ms=350
hover_scale=1.06
typing_cursor_blink_ms=530

# Sounds (optional, uses NovaOS sound theme)
sound_login=login
sound_logout=logout
sound_error=error
