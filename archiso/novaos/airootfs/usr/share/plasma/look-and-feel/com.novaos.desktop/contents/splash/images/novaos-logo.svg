<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256"
     width="256"
     height="256">
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78A0FF"/>
      <stop offset="50%" stop-color="#4A6FE3"/>
      <stop offset="100%" stop-color="#5B7FE8"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#78A0FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#78A0FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#78A0FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- Glow background -->
  <circle cx="128" cy="128" r="120" fill="url(#glow)"/>

  <!-- Outer ring (the "halo") -->
  <circle cx="128" cy="128" r="92" fill="none"
          stroke="url(#grad1)" stroke-width="3" stroke-opacity="0.6"/>
  <circle cx="128" cy="128" r="82" fill="none"
          stroke="url(#grad2)" stroke-width="1" stroke-opacity="0.4"/>

  <!-- The "Nova" star - 4-point compass star -->
  <g transform="translate(128 128)">
    <path d="M 0 -78 L 16 -16 L 78 0 L 16 16 L 0 78 L -16 16 L -78 0 L -16 -16 Z"
          fill="url(#grad1)"
          filter="url(#blur1)"/>
    <path d="M 0 -78 L 16 -16 L 78 0 L 16 16 L 0 78 L -16 16 L -78 0 L -16 -16 Z"
          fill="url(#grad1)"/>
    <path d="M 0 -62 L 12 -12 L 62 0 L 12 12 L 0 62 L -12 12 L -62 0 L -12 -12 Z"
          fill="#FFFFFF" fill-opacity="0.25"/>
  </g>

  <!-- Center accent -->
  <circle cx="128" cy="128" r="14" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="128" cy="128" r="6"  fill="#4A6FE3"/>

  <!-- Wordmark -->
  <text x="128" y="232" font-family="Inter, sans-serif"
        font-size="22" font-weight="600"
        text-anchor="middle"
        fill="#E8EEF7" letter-spacing="6">NOVA OS</text>
</svg>
