#
# NovaOS - archiso profile pacman.conf
# This is the pacman config that mkarchiso uses when building the ISO.
# It is DIFFERENT from /etc/pacman.conf inside the live ISO (which is
# in airootfs/etc/pacman.conf).
#
# IMPORTANT: Only include repos that actually exist and are reachable
# at build time. The [novaos] overlay repo is NOT included here because
# the GitHub release hosting it does not exist yet. NovaOS-specific
# packages are installed via the airootfs customization script instead.
#

[options]
HoldPkg           = pacman glibc
Architecture      = auto
CheckSpace
ParallelDownloads = 8
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional
ILoveCandy

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
