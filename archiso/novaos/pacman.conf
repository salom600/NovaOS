#
# NovaOS - archiso profile pacman.conf
# This is the pacman config that mkarchiso uses when building the ISO.
# It is DIFFERENT from /etc/pacman.conf inside the live ISO (which is
# in airootfs/etc/pacman.conf).
#
# mkarchiso requires this file at the profile root level.
#

[options]
HoldPkg           = pacman glibc
Architecture      = auto
CheckSpace
ParallelDownloads = 8
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional
ILoveCandy

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# NovaOS overlay repo (for novaos-* packages built from this repo)
[novaos]
SigLevel = Optional TrustAll
Server   = https://github.com/salom600/NovaOS/releases/download/repo/$arch
