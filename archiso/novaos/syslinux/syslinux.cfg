DEFAULT archiso
PROMPT 1
TIMEOUT 50

LABEL archiso
    MENU LABEL NovaOS Live (default, Wayland)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nvidia_drm.modeset=1 nvidia_drm.fbdev=1 modprobe.blacklist=nouveau

LABEL archiso-x11
    MENU LABEL NovaOS Live (X11 session - use if Wayland shows blank screen)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nvidia_drm.modeset=1 nvidia_drm.fbdev=1 modprobe.blacklist=nouveau novaos.session=x11

LABEL archiso-safegraphics
    MENU LABEL NovaOS Live (Safe Graphics - nomodeset, software rendering)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset i915.modeset=0 nouveau.modeset=0 nvidia_drm.modeset=0 novaos.session=x11

LABEL archiso-legacycpu
    MENU LABEL NovaOS Live (Legacy CPU - linux-lts kernel for older hardware)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-lts
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux-lts.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nvidia_drm.modeset=1 nvidia_drm.fbdev=1 modprobe.blacklist=nouveau novaos.session=x11

LABEL archiso-legacygpu
    MENU LABEL NovaOS Live (Legacy GPU - 2009-2015 Intel/AMD/Nvidia)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-lts
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux-lts.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nvidia_drm.modeset=1 modprobe.blacklist=nouveau i915.enable_guc=0 i915.enable_fbc=0 novaos.session=x11

ONTIMEOUT archiso
